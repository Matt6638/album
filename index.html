<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フォトアルバム</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111214">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111214;--panel:#1b1d21;--panel2:#25282e;--text:#ececee;--sub:#9a9ca3;--accent:#3d6fe0;--line:#2c2f35}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
#bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(17,18,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:54px}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:15px;min-width:0;flex:1}
#crumbs button{background:none;border:0;color:var(--sub);cursor:pointer;padding:4px 6px;border-radius:6px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumbs button:hover{background:var(--panel2);color:var(--text)}
#crumbs .cur{color:var(--text);font-weight:600;padding:4px 6px}
#crumbs .sep{color:#555;padding:0 2px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#444a54}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#ff8a80}
select.btn{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#9a9ca3 50%),linear-gradient(135deg,#9a9ca3 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.iconbtn{background:none;border:0;color:var(--text);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{background:var(--panel2)}
main{padding:16px 16px 80px;max-width:1700px;margin:0 auto}
h2.sec{font-size:13px;color:var(--sub);font-weight:600;margin:20px 4px 12px;letter-spacing:.05em}
.loading,.empty{color:var(--sub);padding:40px 8px;text-align:center}
.errbox{background:#2a1d1d;border:1px solid #4a2a2a;border-radius:10px;padding:16px;margin:20px 0;line-height:1.7}
/* アルバム一覧 */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
.album{cursor:pointer;text-align:left;background:none;border:0;color:inherit;padding:0;display:flex;flex-direction:column;align-self:start;width:100%}
.album .cover{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel);position:relative;box-shadow:0 1px 0 #ffffff08 inset}
.album:hover .cover img{transform:scale(1.03)}
.album .cover img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s,transform .3s}
.album .cover img.ok{opacity:1}
.album .cover .fold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#3a3e46}
.album .t{margin-top:9px;font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-all}
.album .d{font-size:12.5px;color:#c9cbd1;margin-top:1px}
.album .s{font-size:12px;color:var(--sub);margin-top:2px}
/* 写真グリッド */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.tile{position:relative;aspect-ratio:1;background:var(--panel);border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:3px;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.tile img.ok{opacity:1}
.tile:focus-visible,.album:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:10px;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:11px;padding:8px;text-align:center;word-break:break-all;gap:4px}
.ph b{font-size:22px;color:#4a4e57;font-weight:400}
.summary{color:var(--sub);font-size:13px;margin:2px 4px 0}
/* ホーム */
.home{max-width:760px;margin:30px auto}
.home h1{font-size:26px;margin:0 0 8px}
.home p.lead{color:var(--sub);line-height:1.8;margin:0 0 22px;font-size:14.5px}
.libs{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.lib{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lib .nm{font-weight:600;font-size:16px;flex:1;min-width:0;word-break:break-all}
.lib .nm small{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:3px}
.note{background:var(--panel);border-radius:10px;padding:14px 16px;color:var(--sub);font-size:13px;line-height:1.8;margin-top:28px}
.note b{color:var(--text)}
/* ビューア */
#viewer{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#viewer[hidden]{display:none}
#vstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom}
#vstage img,#vstage video{max-width:100%;max-height:100%;object-fit:contain;display:block}
#vstage img{width:100%;height:100%}
#vstage .msg{color:#bbb;text-align:center;line-height:1.8;padding:20px}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px 26px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));z-index:3;transition:opacity .3s}
.vtop .info{flex:1;min-width:0;color:#eee}
.vtop .info .fn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .info .mt{font-size:12px;color:#aaa;margin-top:2px}
.vtop .btn{background-color:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.vtop .btn.on{background-color:var(--accent)}
.vtop select.btn{background-color:rgba(255,255,255,.12)}
.vtop select.btn option{color:#000}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;cursor:pointer;z-index:3;transition:opacity .3s;display:flex;align-items:center;justify-content:center}
.vnav:hover{background:rgba(255,255,255,.22)}
.vnav.prev{left:14px}.vnav.next{right:14px}
#viewer.idle .vtop,#viewer.idle .vnav{opacity:0;pointer-events:none}
#viewer.idle{cursor:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2e34;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.4)}
/* 宿泊ホテルの表示 */
.album .h{display:none;font-size:12px;color:#c9d6ff;margin-top:3px;line-height:1.45;word-break:break-all}
@media (hover:none){ .album .h{display:block} }
.album .cover .hb{position:absolute;left:8px;top:8px;background:rgba(10,20,45,.78);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:10px;pointer-events:none}
#tip{position:fixed;z-index:150;background:#1d2a4d;color:#fff;border:1px solid #34508f;border-radius:8px;padding:7px 11px;font-size:13px;line-height:1.6;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:420px;white-space:pre-line}
#tip[hidden]{display:none}
.staybox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.staybox .nm{flex:1;min-width:220px;font-size:14px;line-height:1.6}
.staybox .nm small{color:var(--sub);display:block}
/* 地図 */
#mapView{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
#mapView[hidden]{display:none}
.mtop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mtop b{font-size:15px;margin-right:4px}
#mCount{color:var(--sub);font-size:12.5px}
#map{flex:1;min-height:0;background:#dfe6ee}
#mCards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - 150px);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#mCards::-webkit-scrollbar{display:none}
.mcard{flex:0 0 300px;scroll-snap-align:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--text)}
.mcard.sel{border-color:#f0a63a;background:#262016}
.mcard .l1{font-size:12px;color:var(--sub)}
.mcard .l2{font-size:14.5px;font-weight:600;margin-top:2px;line-height:1.4;max-height:2.8em;overflow:hidden}
.mcard .l3{font-size:11.5px;color:#e0a050;margin-top:3px}
.mempty{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.9}
.pin{display:block;width:16px;height:16px;border-radius:50%;background:#1f3c88;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.camp{background:#2e7d4f}
.pin.sel{background:#f08a1a;width:22px;height:22px;margin:-3px}
.mcl{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(31,60,136,.88);color:#fff;font-weight:700;font-size:13px;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.leaflet-tooltip.stay-tip{font-size:12.5px;line-height:1.55;white-space:pre;max-width:none}
dialog#pwDlg{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:min(380px,92vw)}
dialog#pwDlg::backdrop{background:rgba(0,0,0,.6)}
#pwDlg h3{margin:0 0 6px;font-size:16px}
#pwDlg p{margin:0 0 12px;color:var(--sub);font-size:12.5px;line-height:1.7}
#pwDlg input{width:100%;padding:10px 12px;margin:4px 0 10px;border-radius:8px;border:1px solid var(--line);background:#0f1012;color:var(--text);font-size:16px}
#pwDlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#pwMsg{color:#ff8a80;font-size:13px;min-height:1.2em}
@media (max-width:640px){
  .albums{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:2px}
  main{padding:10px 8px 60px}
  .vnav{display:none}
  #bar .hide-sm{display:none}
}
</style>
</head>
<body>
<header id="bar">
  <button id="homeBtn" class="iconbtn" title="フォルダ一覧へ" aria-label="フォルダ一覧へ">⌂</button>
  <nav id="crumbs"></nav>
  <select id="sortSel" class="btn hide-sm" title="アルバムの並び順" hidden>
    <option value="desc">新しい順</option>
    <option value="asc">古い順</option>
  </select>
  <button id="slideAllBtn" class="btn" hidden>▶ スライドショー</button>
  <button id="mapBtn" class="btn" title="宿泊したホテル・施設の地図">🗾 地図</button>
</header>
<main id="main"></main>

<div id="viewer" hidden>
  <div class="vtop">
    <button id="vClose" class="iconbtn" title="閉じる（Esc）" aria-label="閉じる" style="color:#fff">✕</button>
    <div class="info"><div class="fn" id="vName"></div><div class="mt" id="vMeta"></div></div>
    <select id="vInterval" class="btn" title="スライドショーの間隔">
      <option value="3">3秒</option><option value="5">5秒</option><option value="10">10秒</option>
    </select>
    <button id="vSlide" class="btn" title="スライドショー（スペース）">▶ スライド</button>
    <button id="vFull" class="btn" title="全画面（F）">全画面</button>
  </div>
  <button class="vnav prev" id="vPrev" aria-label="前へ">‹</button>
  <button class="vnav next" id="vNext" aria-label="次へ">›</button>
  <div id="vstage"></div>
</div>

<div id="mapView" hidden>
  <div class="mtop">
    <button id="mClose" class="iconbtn" title="閉じる" aria-label="閉じる">✕</button>
    <b>宿泊マップ</b>
    <select id="mYear" class="btn" title="年で絞り込み"></select>
    <button id="mJapan" class="btn">日本全体</button>
    <button id="mAll" class="btn">海外も表示</button>
    <span id="mCount"></span>
  </div>
  <div id="map"></div>
  <div id="mCards"></div>
</div>
<div id="tip" hidden></div>
<dialog id="pwDlg">
  <form method="dialog" id="pwForm">
    <h3 id="pwTitle"></h3>
    <p id="pwNote"></p>
    <input type="password" id="pw1" autocomplete="new-password" placeholder="パスコード">
    <div id="pw2row"><input type="password" id="pw2" autocomplete="new-password" placeholder="もう一度入力"></div>
    <div id="pwMsg"></div>
    <div class="row"><button class="btn" id="pwCancel" type="button">やめる</button><button class="btn primary" id="pwOk" type="submit">OK</button></div>
  </form>
</dialog>

<input type="file" id="dirInput" webkitdirectory multiple hidden>
<input type="file" id="stayInput" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ 基本設定 ============ */
const IMG_EXT = new Set(['jpg','jpeg','jpe','png','gif','webp','bmp','avif','heic','heif']);
const VID_EXT = new Set(['mp4','mov','m4v','webm','mkv','3gp']);
const HEIC_EXT = new Set(['heic','heif']);
const SKIP_DIRS = new Set(['$RECYCLE.BIN','System Volume Information']);
const THUMB_W = 480;
const HAS_FSA = typeof window.showDirectoryPicker === 'function';
const collator = new Intl.Collator('ja', {numeric:true, sensitivity:'base'});
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const extOf = n => { const i = n.lastIndexOf('.'); return i < 0 ? '' : n.slice(i+1).toLowerCase(); };
function kindOf(n){
  if (n.startsWith('.')) return null;           // ._xxx（Macの補助ファイル）や隠しファイルは除外
  const e = extOf(n);
  if (IMG_EXT.has(e)) return 'image';
  if (VID_EXT.has(e)) return 'video';
  return null;
}
function toast(msg, ms=3000){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function fmtDur(s){
  if (!isFinite(s) || s <= 0) return '';
  s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
}
function fmtSize(b){
  if (b >= 1073741824) return (b/1073741824).toFixed(2) + ' GB';
  if (b >= 1048576) return (b/1048576).toFixed(1) + ' MB';
  return Math.max(1, Math.round(b/1024)) + ' KB';
}
function fmtDate(ms){
  const d = new Date(ms);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* フォルダ名の先頭が日付（260515 や 20260515）なら日付と題名に分けて表示（元の名前は変更しない） */
function parseName(name){
  const nowYY = new Date().getFullYear() % 100;
  let m = name.match(/^(\d{2})(\d{2})(\d{2})(?:[_\-\s　]+(.*))?$/);
  if (m){
    const yy = +m[1], mo = +m[2], d = +m[3];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31){
      const y = yy <= nowYY + 1 ? 2000 + yy : 1900 + yy;
      return {title: m[4] || '', date: `${y}年${mo}月${d}日`, iso: `${y}-${m[2]}-${m[3]}`};
    }
  }
  m = name.match(/^((?:19|20)\d{2})[-_.]?(\d{2})[-_.]?(\d{2})(?:[_\-\s　]+(.*))?$/);
  if (m){
    const mo = +m[2], d = +m[3];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return {title: m[4] || '', date: `${+m[1]}年${mo}月${d}日`, iso: `${m[1]}-${m[2]}-${m[3]}`};
  }
  return {title: name, date: '', iso: ''};
}

/* ============ IndexedDB（サムネイルと登録フォルダの保存） ============ */
const db = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('photo-album', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs');
      if (!d.objectStoreNames.contains('libs')) d.createObjectStore('libs', {keyPath:'id'});
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function tx(store, mode, fn){
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get: (s, k) => tx(s, 'readonly', st => st.get(k)),
    put: (s, v, k) => tx(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', st => st.delete(k)),
    all: s => tx(s, 'readonly', st => st.getAll()),
    clear: s => tx(s, 'readwrite', st => st.clear()),
  };
})();

/* ============ フォルダの読み取り ============ */
let lib = null;            // {type:'fs'|'list', name, root}
const listCache = new Map(); // path -> Promise<{dirs, media}>
const metaCache = new Map(); // path -> Promise<{photos, videos, dirCount, cover}>
const scrollPos = new Map();

async function listDir(node){
  if (listCache.has(node.path)) return listCache.get(node.path);
  const p = (async () => {
    const dirs = [], media = [];
    if (lib.type === 'fs'){
      for await (const [name, h] of node.ref.entries()){
        if (name.startsWith('.')) continue;
        if (h.kind === 'directory'){
          if (!SKIP_DIRS.has(name)) dirs.push({name, path: node.path + '/' + name, ref: h});
        } else {
          const k = kindOf(name);
          if (k) media.push({name, path: node.path + '/' + name, kind: k, ref: h});
        }
      }
    } else {
      for (const [name, child] of node.ref.dirs) dirs.push({name, path: node.path + '/' + name, ref: child});
      for (const f of node.ref.files) media.push({name: f.name, path: node.path + '/' + f.name, kind: kindOf(f.name), ref: f});
    }
    return {dirs, media};
  })();
  listCache.set(node.path, p);
  p.catch(() => listCache.delete(node.path));
  return p;
}
const getFile = item => lib.type === 'fs' ? item.ref.getFile() : Promise.resolve(item.ref);
const sortOrder = () => localStorage.getItem('albumSort') || 'desc';
const sortDirs = dirs => [...dirs].sort((a, b) => sortOrder() === 'asc' ? collator.compare(a.name, b.name) : collator.compare(b.name, a.name));
const sortMedia = media => [...media].sort((a, b) => collator.compare(a.name, b.name));

function folderMeta(node, depth = 0){
  const key = node.path + '|' + sortOrder();
  if (metaCache.has(key)) return metaCache.get(key);
  const p = (async () => {
    const {dirs, media} = await listDir(node);
    const sorted = sortMedia(media);
    let cover = sorted.find(m => m.kind === 'image') || sorted[0] || null;
    if (!cover && depth < 3){
      for (const d of sortDirs(dirs)){
        const m = await folderMeta(d, depth + 1);
        if (m.cover){ cover = m.cover; break; }
      }
    }
    return {photos: media.filter(m => m.kind === 'image').length, videos: media.filter(m => m.kind === 'video').length, dirCount: dirs.length, cover};
  })();
  metaCache.set(key, p);
  p.catch(() => metaCache.delete(key));
  return p;
}

/* ============ サムネイル生成（同時実行数を制限・見えているものを優先） ============ */
function makeQueue(limit){
  let active = 0; const stack = [];
  function pump(){
    while (active < limit && stack.length){
      const job = stack.pop();               // 後から頼まれた（＝今見えている）ものを先に
      if (!job.wanted()){ job.reject(new Error('cancelled')); continue; }
      active++;
      job.fn().then(job.resolve, job.reject).finally(() => { active--; pump(); });
    }
  }
  return (fn, wanted) => new Promise((resolve, reject) => { stack.push({fn, wanted, resolve, reject}); pump(); });
}
const imgQueue = makeQueue(4);
const vidQueue = makeQueue(2);
const thumbMem = new Map();   // key -> {url, dur}
const thumbBusy = new Map();  // key -> Promise

let heicLib = null;
function loadHeic(){
  return heicLib ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'vendor/heic2any.min.js';
    s.onload = () => res(window.heic2any);
    s.onerror = () => { heicLib = null; rej(new Error('HEIC変換ライブラリを読み込めませんでした')); };
    document.head.appendChild(s);
  });
}
async function heicToJpeg(blob){
  const h = await loadHeic();
  const out = await h({blob, toType: 'image/jpeg', quality: 0.9});
  return Array.isArray(out) ? out[0] : out;
}
function imgFromBlob(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}
function canvasToBlob(c){ return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.8)); }
async function drawThumb(src, w, h){
  const scale = Math.min(1, THUMB_W / w);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return canvasToBlob(c);
}
async function decodeToDrawable(blob){
  try {
    return await createImageBitmap(blob, {resizeWidth: THUMB_W, resizeQuality: 'medium', imageOrientation: 'from-image'});
  } catch (e) {
    return await imgFromBlob(blob);     // createImageBitmap の縮小指定に対応していないブラウザ向け
  }
}
async function imageThumb(file, name){
  let src;
  try { src = await decodeToDrawable(file); }
  catch (e) {
    if (!HEIC_EXT.has(extOf(name))) throw e;
    src = await decodeToDrawable(await heicToJpeg(file));   // HEIC（iPhone写真）はChrome等で読めないため変換
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const blob = await drawThumb(src, w, h);
  if (src.close) src.close();
  return {blob, dur: 0};
}
function videoThumb(file){
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    const url = URL.createObjectURL(file); let done = false;
    const finish = (err, val) => {
      if (done) return; done = true; clearTimeout(timer);
      v.removeAttribute('src'); v.load(); URL.revokeObjectURL(url);
      err ? rej(err) : res(val);
    };
    const timer = setTimeout(() => finish(new Error('timeout')), 20000);
    v.onloadedmetadata = () => {
      const d = v.duration;
      v.currentTime = (isFinite(d) && d > 0) ? Math.min(1, d * 0.1) : 0.1;
    };
    v.onseeked = async () => {
      try {
        if (!v.videoWidth) throw new Error('no video track');
        const blob = await drawThumb(v, v.videoWidth, v.videoHeight);
        finish(null, {blob, dur: v.duration});
      } catch (e) { finish(e); }
    };
    v.onerror = () => finish(new Error('video decode'));
    v.src = url;
  });
}
async function getThumb(item, wanted){
  const file = await getFile(item);
  const key = item.path + '|' + file.size + '|' + file.lastModified;
  if (thumbMem.has(key)) return thumbMem.get(key);
  if (thumbBusy.has(key)) return thumbBusy.get(key);
  const p = (async () => {
    const cached = await db.get('thumbs', key).catch(() => null);
    let blob, dur;
    if (cached){ ({blob, dur} = cached); }
    else {
      const q = item.kind === 'video' ? vidQueue : imgQueue;
      ({blob, dur} = await q(() => item.kind === 'video' ? videoThumb(file) : imageThumb(file, item.name), wanted));
      db.put('thumbs', {blob, dur}, key).catch(() => {});
    }
    const r = {url: URL.createObjectURL(blob), dur};
    thumbMem.set(key, r);
    return r;
  })();
  thumbBusy.set(key, p);
  p.finally(() => thumbBusy.delete(key));
  return p;
}

/* 画面に入った要素だけ読み込む */
const visible = new WeakMap();
const io = new IntersectionObserver(entries => {
  for (const en of entries){
    visible.set(en.target, en.isIntersecting);
    if (en.isIntersecting && en.target._load && !en.target._started){
      en.target._started = true;
      en.target._load().catch(() => { en.target._started = false; });
    }
  }
}, {rootMargin: '600px 0px'});
function observe(el, loader){ el._load = loader; io.observe(el); }
const wantedFn = el => () => el.isConnected && visible.get(el) !== false;

async function showUsage(){

}

async function addFolder(){
  if (!HAS_FSA){ $('#dirInput').value = ''; $('#dirInput').click(); return; }
  let h;
  try { h = await window.showDirectoryPicker({id: 'photo-album', mode: 'read'}); }
  catch (e) { if (e.name !== 'AbortError') toast('フォルダを開けませんでした：' + e.message); return; }
  const libs = await db.all('libs').catch(() => []);
  for (const l of libs){
    try { if (await l.handle.isSameEntry(h)) return openLibrary(l); } catch (e) {}
  }
  const rec = {id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), name: h.name, handle: h, added: Date.now()};
  await db.put('libs', rec).catch(() => toast('フォルダの登録を保存できませんでした（今回だけ表示します）'));
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  openLibrary(rec);
}

$('#dirInput').addEventListener('change', e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const rootName = (files[0].webkitRelativePath || files[0].name).split('/')[0];
  const root = {dirs: new Map(), files: []};
  for (const f of files){
    const parts = (f.webkitRelativePath || f.name).split('/');
    if (parts.some(p => p.startsWith('.')) || !kindOf(f.name)) continue;
    let cur = root;
    for (let i = 1; i < parts.length - 1; i++){
      if (!cur.dirs.has(parts[i])) cur.dirs.set(parts[i], {dirs: new Map(), files: []});
      cur = cur.dirs.get(parts[i]);
    }
    cur.files.push(f);
  }
  startLibrary({type: 'list', name: rootName}, {name: rootName, path: rootName, ref: root});
});

async function openLibrary(rec){
  try {
    let perm = await rec.handle.queryPermission({mode: 'read'});
    if (perm !== 'granted') perm = await rec.handle.requestPermission({mode: 'read'});
    if (perm !== 'granted'){ toast('閲覧が許可されませんでした'); return; }
  } catch (e) {
    toast('フォルダを開けませんでした。外付けHDDが接続されているか確認してください'); return;
  }
  startLibrary({type: 'fs', name: rec.name}, {name: rec.name, path: rec.name, ref: rec.handle});
}
function startLibrary(l, root){
  lib = l; lib.root = root;
  listCache.clear(); metaCache.clear(); scrollPos.clear();
  trail = [root];
  history.pushState({depth: 0}, '');
  renderFolder();
}

function renderCrumbs(){
  crumbs.innerHTML = '';
  trail.forEach((n, i) => {
    if (i){ const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; crumbs.appendChild(s); }
    if (i === trail.length - 1){
      const c = document.createElement('span'); c.className = 'cur'; c.textContent = n.name; crumbs.appendChild(c);
    } else {
      const b = document.createElement('button'); b.textContent = n.name; b.title = n.name;
      b.onclick = () => history.go(i - (trail.length - 1));
      crumbs.appendChild(b);
    }
  });
}

function goInto(node){
  if (current) scrollPos.set(current.path, window.scrollY);
  trail.push(node);
  history.pushState({depth: trail.length - 1}, '');
  renderFolder();
}

let renderToken = 0;
async function renderFolder(){
  const node = trail[trail.length - 1];
  current = node;
  const token = ++renderToken;
  renderCrumbs();
  document.title = node.name + ' - フォトアルバム';
  main.innerHTML = '<div class="loading">読み込み中…</div>';
  let listing;
  try { listing = await listDir(node); }
  catch (e) {
    if (token !== renderToken) return;
    main.innerHTML = `<div class="errbox">フォルダを読み込めませんでした。<br>外付けHDDが接続されているか、フォルダの場所が変わっていないか確認してください。<br><small style="color:var(--sub)">${esc(e.name + ': ' + e.message)}</small><br><br><button class="btn" id="retry">再読み込み</button></div>`;
    $('#retry').onclick = () => { listCache.delete(node.path); renderFolder(); };
    return;
  }
  if (token !== renderToken) return;
  const dirs = sortDirs(listing.dirs), media = sortMedia(listing.media);
  $('#sortSel').hidden = dirs.length < 2; $('#sortSel').value = sortOrder();
  $('#slideAllBtn').hidden = media.length === 0;
  $('#slideAllBtn').onclick = () => openViewer(media, 0, true);

  main.innerHTML = '';
  if (!dirs.length && !media.length){
    main.innerHTML = '<div class="empty">このフォルダには写真・動画もフォルダもありません。</div>'; return;
  }
  if (dirs.length){
    const h = document.createElement('h2'); h.className = 'sec'; h.textContent = `アルバム（${dirs.length}）`; main.appendChild(h);
    const wrap = document.createElement('div'); wrap.className = 'albums'; main.appendChild(wrap);
    for (const d of dirs) wrap.appendChild(albumCard(d));
  }
  if (media.length){
    const p = media.filter(m => m.kind === 'image').length, v = media.length - p;
    const h = document.createElement('h2'); h.className = 'sec';
    h.textContent = `写真・動画（${[p ? '写真 ' + p : '', v ? '動画 ' + v : ''].filter(Boolean).join('・')}）`;
    main.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
    media.forEach((m, i) => grid.appendChild(mediaTile(m, () => openViewer(media, i, false))));
  }
  const y = scrollPos.get(node.path) || 0;
  requestAnimationFrame(() => window.scrollTo(0, y));
}

function albumCard(d){
  const {title, date, iso} = parseName(d.name);
  const stays = iso ? staysOn(iso) : [];
  const labels = stays.map(stayLabel);
  const el = document.createElement('button'); el.className = 'album';
  el.title = labels.length ? '' : d.name;
  el.innerHTML = `<div class="cover"><div class="fold">▢</div>${labels.length ? '<span class="hb">🏨 宿泊</span>' : ''}</div>
    <div class="t">${esc(title || date)}</div>${title && date ? `<div class="d">${esc(date)}</div>` : ''}<div class="s">　</div>
    ${labels.length ? `<div class="h">${labels.map(l => '🏨 ' + esc(l)).join('<br>')}</div>` : ''}`;
  if (labels.length) el.dataset.stay = labels.join('\n');
  el.onclick = () => goInto(d);
  observe(el, async () => {
    let meta;
    try { meta = await folderMeta(d); }
    catch (e) { el.querySelector('.s').textContent = '読み込めません'; return; }
    const parts = [];
    if (meta.photos) parts.push(`写真 ${meta.photos}`);
    if (meta.videos) parts.push(`動画 ${meta.videos}`);
    if (meta.dirCount) parts.push(`フォルダ ${meta.dirCount}`);
    el.querySelector('.s').textContent = parts.join('・') || '空';
    if (meta.cover){
      let t;
      try { t = await getThumb(meta.cover, wantedFn(el)); }
      catch (e) { if (e.message === 'cancelled') throw e; return; }
      const img = new Image(); img.alt = ''; img.onload = () => img.classList.add('ok'); img.src = t.url;
      const cv = el.querySelector('.cover'); cv.querySelector('.fold')?.remove(); cv.appendChild(img);
    }
  });
  return el;
}

function mediaTile(m, onOpen){
  const el = document.createElement('button'); el.className = 'tile'; el.title = m.name;
  el.innerHTML = m.kind === 'video' ? '<span class="badge">▶</span>' : '';
  el.onclick = onOpen;
  observe(el, async () => {
    try {
      const t = await getThumb(m, wantedFn(el));
      const img = new Image(); img.alt = ''; img.onload = () => img.classList.add('ok'); img.src = t.url;
      el.prepend(img);
      if (m.kind === 'video' && t.dur) el.querySelector('.badge').textContent = '▶ ' + fmtDur(t.dur);
    } catch (e) {
      if (e.message === 'cancelled') throw e;     // 画面外に出たので後で再試行
      el.insertAdjacentHTML('afterbegin', `<div class="ph"><b>${m.kind === 'video' ? '▶' : '▢'}</b>${esc(m.name)}</div>`);
    }
  });
  return el;
}

/* ============ ビューア ============ */
const viewer = $('#viewer'), stage = $('#vstage');
const V = {items: [], index: 0, slide: false, timer: null, url: null, token: 0, open: false};

function openViewer(items, index, slideshow){
  V.items = items; V.index = index; V.open = true;
  viewer.hidden = false;
  history.pushState({depth: trail.length - 1, viewer: true}, '');
  setSlide(!!slideshow);
  show();
  poke();
}
function closeViewerUI(){
  V.open = false; setSlide(false);
  stage.innerHTML = ''; if (V.url){ URL.revokeObjectURL(V.url); V.url = null; }
  viewer.hidden = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
async function show(){
  const token = ++V.token;
  const item = V.items[V.index];
  clearTimeout(V.timer);
  $('#vName').textContent = item.name;
  $('#vMeta').textContent = `${V.index + 1} / ${V.items.length}`;
  let file;
  try { file = await getFile(item); }
  catch (e) { if (token === V.token) stage.innerHTML = '<div class="msg">ファイルを読み込めませんでした。<br>外付けHDDが接続されているか確認してください。</div>'; return; }
  if (token !== V.token) return;
  $('#vMeta').textContent = `${V.index + 1} / ${V.items.length}　${fmtDate(file.lastModified)}　${fmtSize(file.size)}`;
  if (V.url){ URL.revokeObjectURL(V.url); V.url = null; }
  stage.innerHTML = '';
  if (item.kind === 'image'){
    let blob = file;
    const img = new Image(); img.alt = item.name; img.decoding = 'async';
    const ok = await new Promise(res => {
      img.onload = () => res(true); img.onerror = () => res(false);
      V.url = URL.createObjectURL(blob); img.src = V.url;
    });
    if (token !== V.token) return;
    if (!ok && HEIC_EXT.has(extOf(item.name))){
      stage.innerHTML = '<div class="msg">HEIC画像を変換しています…</div>';
      try { blob = await heicToJpeg(file); } catch (e) { blob = null; }
      if (token !== V.token) return;
      if (blob){ URL.revokeObjectURL(V.url); V.url = URL.createObjectURL(blob); img.src = V.url; await img.decode().catch(() => {}); stage.innerHTML = ''; stage.appendChild(img); }
      else stage.innerHTML = `<div class="msg">この画像は表示できませんでした。<br>${esc(item.name)}</div>`;
    } else if (ok){
      stage.appendChild(img);
    } else {
      stage.innerHTML = `<div class="msg">この画像は表示できませんでした。<br>${esc(item.name)}</div>`;
    }
    if (V.slide) V.timer = setTimeout(next, intervalMs());
    preloadNext();
  } else {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.autoplay = true;
    V.url = URL.createObjectURL(file); v.src = V.url;
    v.onended = () => { if (V.slide) next(); };
    v.onerror = () => {
      if (token !== V.token) return;
      stage.innerHTML = `<div class="msg">この動画はこのブラウザでは再生できない形式の可能性があります。<br>${esc(item.name)}<br><small>（Macの場合、Safari・Chromeで再生できない形式は QuickTime Player で開いてください）</small></div>`;
      if (V.slide) V.timer = setTimeout(next, intervalMs());
    };
    stage.appendChild(v);
    v.play().catch(() => {});   // 自動再生が止められた場合は再生ボタンで再生
  }
}
let preloadImg = null;
async function preloadNext(){
  const n = V.items[(V.index + 1) % V.items.length];
  if (!n || n.kind !== 'image' || HEIC_EXT.has(extOf(n.name))) return;
  try {
    const f = await getFile(n);
    if (preloadImg?._url) URL.revokeObjectURL(preloadImg._url);
    preloadImg = new Image(); preloadImg._url = URL.createObjectURL(f); preloadImg.src = preloadImg._url;
    preloadImg.decode().catch(() => {});
  } catch (e) {}
}
const intervalMs = () => (+$('#vInterval').value || 5) * 1000;
function next(){ V.index = (V.index + 1) % V.items.length; show(); }
function prev(){ V.index = (V.index - 1 + V.items.length) % V.items.length; show(); }
function setSlide(on){
  V.slide = on;
  $('#vSlide').classList.toggle('on', on);
  $('#vSlide').textContent = on ? '❚❚ 停止' : '▶ スライド';
  clearTimeout(V.timer);
  if (on && V.open && V.items[V.index]?.kind === 'image' && stage.querySelector('img')) V.timer = setTimeout(next, intervalMs());
}
$('#vInterval').value = localStorage.getItem('slideInterval') || '5';
$('#vInterval').onchange = e => { localStorage.setItem('slideInterval', e.target.value); if (V.slide) setSlide(true); };
$('#vNext').onclick = e => { e.stopPropagation(); next(); };
$('#vPrev').onclick = e => { e.stopPropagation(); prev(); };
$('#vClose').onclick = () => history.back();
$('#vSlide').onclick = () => setSlide(!V.slide);
$('#vFull').onclick = toggleFull;
function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else viewer.requestFullscreen?.().catch(() => {});
}
document.addEventListener('keydown', e => {
  if (!V.open) return;
  if (e.target.tagName === 'SELECT') return;
  const vid = stage.querySelector('video');
  if (e.key === 'ArrowRight'){ next(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ prev(); e.preventDefault(); }
  else if (e.key === 'Escape'){ if (!document.fullscreenElement) history.back(); }
  else if (e.key === 'f' || e.key === 'F'){ toggleFull(); }
  else if (e.key === ' '){
    e.preventDefault();
    if (vid){ vid.paused ? vid.play() : vid.pause(); } else setSlide(!V.slide);
  }
  poke();
});
/* マウスを止めると操作ボタンを隠す */
let idleT = null;
function poke(){ viewer.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => viewer.classList.add('idle'), 2500); }
viewer.addEventListener('mousemove', poke);
/* スワイプで前後へ */
let sx = null, sy = null;
stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse'){ sx = e.clientX; sy = e.clientY; } });
stage.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? next : prev)();
  else poke();
});

/* ============ 宿泊データ（カレンダーから作った宿泊記録.json） ============ */
let STAYS = null;   // {stays:[...], importedAt, minDate, maxDate, ...}
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
async function loadStays(){ try { STAYS = (await db.get('kv', 'stays')) || null; } catch (e) { STAYS = null; } }
const yymmdd = iso => iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
const stayLabel = s => yymmdd(s.checkin) + '_' + s.name;
function staysOn(iso){
  if (!STAYS) return [];
  return STAYS.stays.filter(s => s.checkin <= iso && iso <= s.checkout).sort((a, b) => a.checkin < b.checkin ? -1 : 1);
}
function fmtJpDate(iso){ return `${+iso.slice(0, 4)}年${+iso.slice(5, 7)}月${+iso.slice(8, 10)}日`; }
function stayRange(s){
  const a = fmtJpDate(s.checkin), b = s.checkout.slice(0, 4) === s.checkin.slice(0, 4) ? `${+s.checkout.slice(5, 7)}月${+s.checkout.slice(8, 10)}日` : fmtJpDate(s.checkout);
  return a + '〜' + b;
}
function validateStays(obj){
  if (!obj || !Array.isArray(obj.stays)) throw new Error('宿泊データの形式ではありません（stays がありません）');
  obj.stays.forEach((s, i) => {
    if (!s || typeof s.name !== 'string' || !s.name) throw new Error(`${i + 1}件目：name がありません`);
    if (!ISO_RE.test(s.checkin) || !ISO_RE.test(s.checkout)) throw new Error(`${i + 1}件目（${s.name}）：日付の形式が違います`);
    for (const k of ['lat', 'lng']) if (s[k] != null && typeof s[k] !== 'number') throw new Error(`${i + 1}件目（${s.name}）：${k} が数値ではありません`);
  });
}
/* パスコードでの暗号化（PBKDF2-SHA256 で鍵を作り AES-256-GCM で暗号化。ブラウザ標準の Web Crypto を使用） */
function toB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(str){ const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function lockStays(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const key = await deriveKey(pass, salt, iter);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {format: 'photo-album-stays-locked', version: 1, note: 'フォトアルバムの宿泊データ（パスコードで暗号化）',
          kdf: 'PBKDF2-SHA256', iter, cipher: 'AES-256-GCM', salt: toB64(salt), iv: toB64(iv), data: toB64(new Uint8Array(ct))};
}
async function unlockStays(locked, pass){
  const key = await deriveKey(pass, fromB64(locked.salt), locked.iter);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(locked.iv)}, key, fromB64(locked.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function askPass({title, note = '', confirm = false, msg = ''}){
  return new Promise(res => {
    const d = $('#pwDlg');
    $('#pwTitle').textContent = title; $('#pwNote').textContent = note; $('#pwMsg').textContent = msg;
    $('#pw1').value = ''; $('#pw2').value = ''; $('#pw2row').hidden = !confirm;
    let done = false; const finish = v => { if (done) return; done = true; d.close(); res(v); };
    $('#pwForm').onsubmit = e => {
      e.preventDefault();
      const a = $('#pw1').value;
      if (!a) { $('#pwMsg').textContent = 'パスコードを入力してください'; return; }
      if (confirm){
        if (a.length < 6) { $('#pwMsg').textContent = '6文字以上にしてください'; return; }
        if (a !== $('#pw2').value) { $('#pwMsg').textContent = '2回の入力が一致しません'; return; }
      }
      finish(a);
    };
    $('#pwCancel').onclick = () => finish(null);
    d.oncancel = e => { e.preventDefault(); finish(null); };
    d.showModal(); $('#pw1').focus();
  });
}
async function exportLocked(){
  if (!STAYS) return;
  const p = await askPass({title: 'パスコードを設定', confirm: true,
    note: 'このパスコードがないとファイルを開けなくなります。忘れると戻せないので、パスワードアプリなどに控えてください。'});
  if (!p) return;
  const {importedAt, fileName, minDate, maxDate, ...plain} = STAYS;
  const locked = await lockStays(plain, p);
  const back = await unlockStays(locked, p);   // 保存前に、同じパスコードで元に戻せるか確認
  if (JSON.stringify(back) !== JSON.stringify(plain)) throw new Error('暗号化の確認に失敗しました');
  const blob = new Blob([JSON.stringify(locked)], {type: 'application/json'});
  const name = '宿泊記録_パスコード付き.json';
  if (window.showSaveFilePicker){
    try {
      const h = await window.showSaveFilePicker({suggestedName: name, types: [{description: 'JSONファイル', accept: {'application/json': ['.json']}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close();
      toast('パスコード付きのファイルを保存しました'); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('パスコード付きのファイルをダウンロードしました');
}

$('#stayInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    let obj = JSON.parse(await f.text());
    if (obj && obj.format === 'photo-album-stays-locked'){
      let msg = '';
      for (;;){
        const p = await askPass({title: '宿泊データのパスコード', note: 'このファイルはパスコードで保護されています。', msg});
        if (p === null) return;
        try { obj = await unlockStays(obj, p); break; }
        catch (err) { msg = 'パスコードが違います'; }
      }
    }
    validateStays(obj);
    const ds = obj.stays.map(s => s.checkin).sort();
    const rec = Object.assign({}, obj, {importedAt: Date.now(), fileName: f.name, minDate: ds[0] || '', maxDate: ds[ds.length - 1] || ''});
    await db.put('kv', rec, 'stays');
    STAYS = rec;
    toast(`宿泊データを ${obj.stays.length}件 読み込みました`);
    metaCache.clear();
    if (M.open) buildMapData(); else if (trail.length) renderFolder(); else renderHome();
  } catch (err) { alert('読み込めませんでした：' + err.message); }
});

/* アルバムの表紙にカーソルを合わせると宿泊ホテルを表示 */
const tip = $('#tip');
main.addEventListener('mouseover', e => {
  const cv = e.target.closest('.album[data-stay] .cover');
  if (!cv) return;
  tip.textContent = '🏨 ' + cv.parentElement.dataset.stay.split('\n').join('\n🏨 ');
  tip.hidden = false;
});
main.addEventListener('mousemove', e => {
  if (tip.hidden) return;
  if (!e.target.closest('.album[data-stay] .cover')){ tip.hidden = true; return; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = innerWidth - w - 8;
  if (y + h > innerHeight - 8) y = e.clientY - h - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
main.addEventListener('mouseleave', () => { tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, {passive: true});

/* ============ 宿泊マップ ============ */
const M = {open: false, map: null, cluster: null, list: [], markers: new Map(), sel: -1, cardTimer: null, lib: null};
const JAPAN = [[23.6, 122.9], [45.6, 146.0]];
function loadAsset(tag, url){
  return new Promise((res, rej) => {
    const el = document.createElement(tag);
    if (tag === 'link'){ el.rel = 'stylesheet'; el.href = url; } else { el.src = url; }
    el.onload = res; el.onerror = () => rej(new Error(url + ' を読み込めませんでした'));
    document.head.appendChild(el);
  });
}
function loadLeaflet(){
  return M.lib ||= (async () => {
    await loadAsset('link', 'vendor/leaflet/leaflet.css');
    await loadAsset('link', 'vendor/leaflet/MarkerCluster.css');
    await loadAsset('script', 'vendor/leaflet/leaflet.js');
    await loadAsset('script', 'vendor/leaflet/leaflet.markercluster.js');
  })().catch(e => { M.lib = null; throw e; });
}
async function openMap(){
  tip.hidden = true;
  M.open = true; $('#mapView').hidden = false;
  history.pushState(Object.assign({}, history.state || {}, {map: true}), '');
  if (!STAYS){
    $('#map').innerHTML = `<div class="mempty">宿泊データがまだ読み込まれていません。<br>カレンダーから作った「宿泊記録.json」を読み込んでください。<br><br><button class="btn primary" id="mLoad">宿泊データを読み込む</button></div>`;
    $('#mLoad').onclick = () => { $('#stayInput').value = ''; $('#stayInput').click(); };
    $('#mCards').innerHTML = ''; $('#mCount').textContent = ''; $('#mYear').hidden = true;
    return;
  }
  try { await loadLeaflet(); }
  catch (e) { $('#map').innerHTML = `<div class="mempty">地図を読み込めませんでした。<br>${esc(e.message)}</div>`; return; }
  if (!M.map){
    $('#map').innerHTML = '';
    M.map = L.map('map', {zoomControl: true, worldCopyJump: true, minZoom: 2});
    M.map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'
    }).addTo(M.map);
    M.map.fitBounds(JAPAN);
  }
  $('#mYear').hidden = false;
  buildMapData();
  setTimeout(() => M.map.invalidateSize(), 50);
}
function closeMapUI(){ M.open = false; $('#mapView').hidden = true; }

function buildMapData(){
  if (!M.map) return openMap();
  const years = [...new Set(STAYS.stays.map(s => s.checkin.slice(0, 4)))].sort().reverse();
  const ysel = $('#mYear'), cur = ysel.value;
  ysel.innerHTML = '<option value="">すべての年</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
  ysel.value = years.includes(cur) ? cur : '';
  renderMapList();
}
function renderMapList(){
  const y = $('#mYear').value;
  M.list = STAYS.stays.filter(s => !y || s.checkin.startsWith(y)).sort((a, b) => a.checkin < b.checkin ? 1 : -1);
  // 同じ場所の宿泊を1つの印にまとめる
  const places = new Map();
  M.list.forEach((s, i) => {
    if (typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
    const key = s.lat.toFixed(4) + ',' + s.lng.toFixed(4);
    if (!places.has(key)) places.set(key, {lat: s.lat, lng: s.lng, idx: [], camp: s.kind === 'camp'});
    places.get(key).idx.push(i);
  });
  if (M.cluster) M.map.removeLayer(M.cluster);
  M.cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 38, spiderfyOnMaxZoom: true,
    iconCreateFunction: c => L.divIcon({html: `<span class="mcl">${c.getChildCount()}</span>`, className: '', iconSize: [34, 34]})
  });
  M.markers = new Map();   // 宿泊の番号 -> 印
  for (const p of places.values()){
    const mk = L.marker([p.lat, p.lng], {icon: pinIcon(p.camp, false), riseOnHover: true});
    mk._place = p;
    const lines = p.idx.slice().sort((a, b) => M.list[a].checkin < M.list[b].checkin ? -1 : 1).map(i => stayLabel(M.list[i]));
    mk.bindTooltip(esc(lines.join('\n')), {direction: 'top', offset: [0, -10], className: 'stay-tip'});
    mk.on('click', () => { selectStay(p.idx[0], {scrollCard: true, fromMarker: true}); mk.openTooltip(); });
    p.idx.forEach(i => M.markers.set(i, mk));
    M.cluster.addLayer(mk);
  }
  M.map.addLayer(M.cluster);
  const noPos = M.list.length - [...places.values()].reduce((n, p) => n + p.idx.length, 0);
  $('#mCount').textContent = `宿泊 ${M.list.length}件・${places.size}か所` + (noPos ? `（位置未確定 ${noPos}件は地図に出ません）` : '');
  const cards = $('#mCards');
  cards.innerHTML = M.list.map((s, i) => `<button class="mcard" data-i="${i}">
    <div class="l1">${esc(stayRange(s))}${s.kind === 'camp' ? '・キャンプ' : ''}</div>
    <div class="l2">${esc(s.name)}</div>
    ${typeof s.lat === 'number' ? '' : '<div class="l3">地図の位置未確定</div>'}</button>`).join('');
  cards.scrollLeft = 0;
  M.sel = -1;
  if (M.list.length) selectStay(0, {noMove: true});
}
function pinIcon(camp, sel){
  return L.divIcon({html: `<span class="pin${camp ? ' camp' : ''}${sel ? ' sel' : ''}"></span>`, className: '', iconSize: [16, 16], iconAnchor: [8, 8]});
}
let selMarker = null;
function selectStay(i, opt = {}){
  if (i === M.sel && !opt.fromMarker) return;
  M.sel = i;
  document.querySelectorAll('.mcard.sel').forEach(c => c.classList.remove('sel'));
  const card = document.querySelector(`.mcard[data-i="${i}"]`);
  if (card){
    card.classList.add('sel');
    if (opt.scrollCard) card.scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
  }
  if (selMarker){ selMarker.setIcon(pinIcon(selMarker._place.camp, false)); selMarker.closeTooltip(); selMarker = null; }
  const mk = M.markers.get(i);
  if (!mk) return;
  mk.setIcon(pinIcon(mk._place.camp, true)); selMarker = mk;
  if (opt.noMove) return;
  if (opt.fromMarker){ mk.openTooltip(); return; }
  M.cluster.zoomToShowLayer(mk, () => {
    if (M.map.getZoom() < 8) M.map.setView(mk.getLatLng(), 8, {animate: true});
    else M.map.panTo(mk.getLatLng(), {animate: true});
    setTimeout(() => { if (selMarker === mk) mk.openTooltip(); }, 350);
  });
}
/* カードを横にフリック → 真ん中に来た宿泊を地図に表示 */
$('#mCards').addEventListener('scroll', () => {
  clearTimeout(M.cardTimer);
  M.cardTimer = setTimeout(() => {
    const box = $('#mCards'), mid = box.getBoundingClientRect().left + box.clientWidth / 2;
    let best = -1, bd = 1e9;
    box.querySelectorAll('.mcard').forEach(c => { const r = c.getBoundingClientRect(); const d = Math.abs(r.left + r.width / 2 - mid); if (d < bd){ bd = d; best = +c.dataset.i; } });
    if (best >= 0) selectStay(best);
  }, 140);
}, {passive: true});
$('#mCards').addEventListener('click', e => {
  const c = e.target.closest('.mcard'); if (!c) return;
  const i = +c.dataset.i; M.sel = -1;
  c.scrollIntoView({behavior: 'smooth', inline: 'center', block: 'nearest'});
  selectStay(i);
});
$('#mYear').onchange = () => { renderMapList(); M.map.fitBounds(JAPAN); };
$('#mJapan').onclick = () => M.map && M.map.fitBounds(JAPAN);
$('#mAll').onclick = () => { if (M.map && M.cluster && M.cluster.getLayers().length) M.map.fitBounds(M.cluster.getBounds(), {padding: [30, 30]}); };
$('#mClose').onclick = () => history.back();
$('#mapBtn').onclick = openMap;
document.addEventListener('keydown', e => { if (M.open && !V.open && e.key === 'Escape') history.back(); });

/* ============ ブラウザの「戻る」に対応 ============ */
window.addEventListener('popstate', e => {
  const st = e.state;
  if (M.open && !(st && st.map)){
    closeMapUI();
    if (!st || (typeof st.depth === 'number' && st.depth === trail.length - 1)) return;
  }
  if (st && st.map && !M.open){ history.back(); return; }
  if (V.open && !(st && st.viewer)){ closeViewerUI(); if (st && typeof st.depth === 'number' && st.depth === trail.length - 1) return; }
  if (!st || typeof st.depth !== 'number' || !lib){ lib = null; renderHome(); return; }
  if (st.viewer) { history.back(); return; }     // 閉じたビューアの履歴に戻った場合はさらに戻る
  if (st.depth < trail.length - 1){
    if (current) scrollPos.set(current.path, window.scrollY);
    trail = trail.slice(0, st.depth + 1);
    renderFolder();
  } else if (st.depth > trail.length - 1){
    history.back();   // 進むで消えた階層へは行けないので戻す
  }
});

history.replaceState(null, '');
loadStays().finally(renderHome);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
