  <path d="M256 392 C 236 374 214 362 214 346 C 214 334 224 326 234 326 C 244 326 251 332 256 340 C 261 332 268 326 278 326 C 288 326 298 334 298 346 C 298 362 276 374 256 392 Z" fill="#e8566c"/>
